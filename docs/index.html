<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Kvadrat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1a1a2e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #1a1a2e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 200;
        }

        #loading-screen h1 {
            color: #e94560;
            font-size: 48px;
            margin-bottom: 20px;
        }

        #loading-screen p {
            color: #fff;
            font-size: 18px;
        }

        .loading-bar {
            width: 200px;
            height: 10px;
            background: #2a2a4a;
            border-radius: 5px;
            margin-top: 20px;
            overflow: hidden;
        }

        .loading-bar-fill {
            height: 100%;
            background: #e94560;
            width: 0%;
            transition: width 0.3s;
        }

        #game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            height: 100%;
            width: 100%;
            padding: 15px 10px;
            padding-top: env(safe-area-inset-top, 15px);
            position: relative;
            overflow-y: auto;
        }

        #game-area {
            display: flex;
            align-items: flex-start;
            gap: 20px;
            position: relative;
        }

        #play-area-wrapper {
            position: relative;
        }

        #main-canvas {
            border: 3px solid #4a4a6a;
            border-radius: 5px;
            background: #16213e;
            display: block;
        }

        /* Touch rotation zones - visible on mobile */
        .rotate-zone {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 25%;
            display: none;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: 10;
        }

        .rotate-zone-left {
            left: 0;
            background: linear-gradient(to right, rgba(186, 14, 245, 0.15), transparent);
            border-radius: 5px 0 0 5px;
        }

        .rotate-zone-right {
            right: 0;
            background: linear-gradient(to left, rgba(186, 14, 245, 0.15), transparent);
            border-radius: 0 5px 5px 0;
        }

        .rotate-icon {
            font-size: 28px;
            color: rgba(255, 255, 255, 0.4);
            pointer-events: none;
        }

        #side-panel {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .panel-section {
            background: #16213e;
            border: 2px solid #4a4a6a;
            border-radius: 5px;
            padding: 8px 12px;
        }

        .panel-title {
            color: #e94560;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 3px;
            text-transform: uppercase;
        }

        .stat-value {
            color: #fff;
            font-size: 18px;
            font-weight: bold;
        }

        #next-canvas {
            background: #16213e;
        }

        #pause-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 100;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        #pause-overlay h2 {
            color: #e94560;
            font-size: 42px;
            margin-bottom: 20px;
        }

        #pause-overlay p {
            color: #fff;
            font-size: 18px;
            margin: 5px 0;
        }

        #pause-overlay button {
            margin-top: 20px;
            padding: 15px 40px;
            font-size: 18px;
            background: #e94560;
            color: #fff;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        #pause-overlay button:hover {
            background: #ff6b8a;
        }

        .game-over #pause-overlay h2 {
            color: #ff4444;
        }

        .game-won #pause-overlay h2 {
            color: #4ade80;
        }

        /* Desktop instructions */
        #instructions {
            color: #8888aa;
            font-size: 11px;
            margin-top: 10px;
            text-align: center;
        }

        /* Mobile touch hint */
        #touch-hint {
            display: none;
            color: #6a6a8a;
            font-size: 10px;
            margin-top: 8px;
            text-align: center;
            line-height: 1.4;
        }

        /* Responsive styles */
        @media (max-width: 700px) {
            #game-area {
                flex-direction: column;
                align-items: center;
            }

            #side-panel {
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: center;
                gap: 8px;
            }

            .panel-section {
                padding: 6px 10px;
            }

            .panel-title {
                font-size: 10px;
            }

            .stat-value {
                font-size: 16px;
            }

            #instructions {
                display: none;
            }

            #touch-hint {
                display: block;
            }

            .rotate-zone {
                display: flex;
            }
        }
    </style>
</head>
<body>
    <div id="loading-screen">
        <h1>KVADRAT</h1>
        <p id="loading-text">Loading dictionary...</p>
        <div class="loading-bar">
            <div class="loading-bar-fill" id="loading-bar-fill"></div>
        </div>
    </div>

    <div id="game-container">
        <div id="build-time" style="color: #555; font-size: 10px; margin-bottom: 5px;"></div>
        <div id="game-area">
            <div id="play-area-wrapper">
                <canvas id="main-canvas"></canvas>
                <div class="rotate-zone rotate-zone-left">
                    <span class="rotate-icon">&#x21BA;</span>
                </div>
                <div class="rotate-zone rotate-zone-right">
                    <span class="rotate-icon">&#x21BB;</span>
                </div>
            </div>
            <div id="side-panel">
                <div class="panel-section">
                    <div class="panel-title">Score</div>
                    <div class="stat-value" id="score-display">0</div>
                </div>
                <div class="panel-section">
                    <div class="panel-title">Lines</div>
                    <div class="stat-value" id="lines-display">0/40</div>
                </div>
                <div class="panel-section">
                    <div class="panel-title">Words</div>
                    <div class="stat-value" id="words-display">0</div>
                </div>
                <div class="panel-section">
                    <div class="panel-title">High Score</div>
                    <div class="stat-value" id="high-score-display">0</div>
                </div>
                <div class="panel-section">
                    <div class="panel-title">Next</div>
                    <canvas id="next-canvas"></canvas>
                </div>
            </div>
        </div>

        <div id="instructions">
            Arrow Keys: Move | Z/X: Rotate | Space: Hard Drop | P: Pause
        </div>

        <div id="touch-hint">
            Swipe: Move/Drop | Tap: Rotate | Swipe up: Hard drop
        </div>

        <div id="debug-info" style="color: #888; font-size: 11px; margin-top: 8px;"></div>
    </div>

    <div id="pause-overlay">
        <h2 id="overlay-title">PAUSED</h2>
        <p id="overlay-score"></p>
        <p id="overlay-lines"></p>
        <p id="overlay-words"></p>
        <button id="overlay-button">Resume</button>
    </div>

    <script src="game.js"></script>
</body>
</html>
